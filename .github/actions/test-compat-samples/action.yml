name: Test Compat Sample
description: Test a single compat sample to verify Kotlin version compatibility

inputs:
  kotlin-version:
    description: Kotlin version to test (e.g., 2.2.0, 2.3.20)
    required: true

runs:
  using: composite
  steps:
    - name: Clean compiler module
      shell: bash
      run: ./gradlew :compiler:clean --no-daemon

    - name: Publish Fakt plugin to Maven Local
      shell: bash
      env:
        ORG_GRADLE_PROJECT_SKIP_SIGNING: true
      run: ./gradlew publishToMavenLocal --no-daemon --no-build-cache --no-configuration-cache

    - name: Test compat sample (Kotlin ${{ inputs.kotlin-version }})
      shell: bash
      run: ./gradlew -p samples/compat/kotlin-${{ inputs.kotlin-version }} jvmTest --no-daemon

name: Test AGP Compat Sample
description: >-
  Build and unit-test a single AGP-compat sample to verify Android test-fixtures support on a
  pinned Android Gradle Plugin version. Each sample ships its own Gradle wrapper (AGP 8.7 needs
  Gradle 8.9, which the repo-root Gradle 9 wrapper cannot provide), so the sample is built with its
  OWN wrapper via `working-directory`, not `./gradlew -p` from the root.

inputs:
  agp-version:
    description: AGP version directory suffix (e.g. 8.7, 8.12, 9.0)
    required: true

runs:
  using: composite
  steps:
    - name: Restore Plugin Bundle
      uses: ./.github/actions/restore-plugin-bundle

    - name: Test AGP compat sample (AGP ${{ inputs.agp-version }})
      shell: bash
      working-directory: samples/compat-agp/agp-${{ inputs.agp-version }}
      run: ./gradlew testDebugUnitTest --no-daemon

    # Issue #142. AGP 9.0 ships built-in Kotlin support, so Fakt cannot read that module's Kotlin
    # source sets and falls back to generating inside `compileKotlin*` — where the fakes are an
    # undeclared side effect, and a warm cache used to restore the compilation without them. The
    # 8.x cells apply KGP and take the cache-correct path instead, so running the same contract
    # across the matrix covers both paths for free.
    - name: Verify fakes survive clean on a warm cache (#142)
      shell: bash
      env:
        FAKT_GRADLE: ./gradlew
        FAKT_GRADLE_DIR: samples/compat-agp/agp-${{ inputs.agp-version }}
      run: >-
        ./.github/scripts/clean-rebuild-cache-check.sh
        samples/compat-agp/agp-${{ inputs.agp-version }} testDebugUnitTest

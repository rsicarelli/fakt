name: Setup Environment
description: Setup common build environment for Fakt (Java, Gradle, validation)

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Read Node.js version from .tool-versions
      id: node-version
      shell: bash
      run: echo "version=$(grep nodejs .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.node-version.outputs.version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        validate-wrappers: true
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
        add-job-summary: 'never'

name: Development

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_CI: true

permissions:
  contents: read # Required for checkout

jobs:
  check-code-changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for documentation-only changes
        uses: actions/github-script@v7
        id: check
        with:
          script: |
            const checkChangedFiles = require('./.github/scripts/check-changed-files.js');
            return await checkChangedFiles({
              github,
              context,
              core,
              skipExtensions: ['.md', '.txt']
            });

  validate-detekt:
    name: Validate Detekt
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Detekt
        uses: ./.github/actions/validate-detekt

  validate-spotless:
    name: Validate Spotless
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Spotless
        uses: ./.github/actions/validate-spotless

  validate-licenses:
    name: Validate Licenses
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run License Check
        uses: ./.github/actions/validate-licenses

  validate-api:
    name: Validate API
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run API Check
        uses: ./.github/actions/validate-api

  run-tests:
    name: Run Tests
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Execute Tests
        uses: ./.github/actions/run-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-compiler
          path: |
            **/build/test-results/**/TEST-*.xml
            !samples/**/build/test-results/**
          retention-days: 1

  test-samples:
    name: Test Samples
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Sample Tests
        uses: ./.github/actions/test-samples

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-samples
          path: samples/**/build/test-results/**/TEST-*.xml
          retention-days: 1

  ci-summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - check-code-changes
      - validate-detekt
      - validate-spotless
      - validate-licenses
      - validate-api
      - run-tests
      - test-samples
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Download compiler test results
        if: needs.check-code-changes.outputs.has-changes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-results-compiler
          path: test-results
        continue-on-error: true

      - name: Download sample test results
        if: needs.check-code-changes.outputs.has-changes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-results-samples
          path: test-results
        continue-on-error: true

      - name: Generate test summary
        if: needs.check-code-changes.outputs.has-changes == 'true'
        run: kotlin .github/scripts/test-summary.main.kts "test-results" "Test Results"

      - name: Check CI status
        run: |
          if [[ "${{ needs.check-code-changes.outputs.has-changes }}" == "false" ]]; then
            echo "✅ Documentation-only changes - all jobs skipped successfully"
            exit 0
          fi

          # Check if any job failed
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some CI jobs failed"
            exit 1
          fi

          # Check if any job was cancelled
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️  Some CI jobs were cancelled"
            exit 1
          fi

          echo "✅ All CI jobs passed successfully"
          exit 0

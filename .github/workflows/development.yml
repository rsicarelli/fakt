name: Development

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_CI: true

permissions:
  contents: read # Required for checkout

jobs:
  check-code-changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for documentation-only changes
        uses: actions/github-script@v8
        id: check
        with:
          script: |
            const checkChangedFiles = require('./.github/scripts/check-changed-files.js');
            return await checkChangedFiles({
              github,
              context,
              core,
              skipExtensions: ['.md', '.txt']
            });

  validate-detekt:
    name: Validate Detekt
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Detekt
        uses: ./.github/actions/validate-detekt

  validate-spotless:
    name: Validate Spotless
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Spotless
        uses: ./.github/actions/validate-spotless

  validate-licenses:
    name: Validate Licenses
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run License Check
        uses: ./.github/actions/validate-licenses

  validate-api:
    name: Validate API
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run API Check
        uses: ./.github/actions/validate-api

  publish-plugin-bundle:
    name: Publish Plugin Bundle
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Publish Plugin Bundle
        uses: ./.github/actions/publish-plugin-bundle

  run-tests:
    name: Run Tests
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Execute Tests
        uses: ./.github/actions/run-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-compiler
          path: |
            **/build/test-results/**/TEST-*.xml
            !samples/**/build/test-results/**
          retention-days: 1

  test-samples:
    name: Sample / ${{ matrix.sample }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: jvm-single-module
            path: samples/jvm-single-module
            tasks: build
          - sample: android-single-module
            path: samples/android-single-module
            tasks: build
          - sample: android-test-fixtures
            path: samples/android-test-fixtures
            tasks: build
          - sample: jvm-test-fixtures
            path: samples/jvm-test-fixtures
            tasks: build
          - sample: kmp-single-module
            path: samples/kmp-single-module
            tasks: allTests --continue
            check: true
          - sample: kmp-multi-target
            path: samples/kmp-multi-target
            tasks: allTests --continue
            check: true
          - sample: kmp-no-jvm
            path: samples/kmp-no-jvm
            tasks: allTests --continue
            check: true
          - sample: kmp-multi-module
            path: samples/kmp-multi-module
            tasks: allTests --continue
            check: true
          - sample: fake-publishing
            path: samples/fake-publishing/kmp-consumer
            tasks: allTests --continue
            check: true
            pre-publish: samples/fake-publishing/kmp-publisher
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Restore Plugin Bundle
        uses: ./.github/actions/restore-plugin-bundle

      - name: Pre-publish dependency
        if: ${{ matrix.pre-publish }}
        env:
          ORG_GRADLE_PROJECT_SKIP_SIGNING: true
        run: ./gradlew -p ${{ matrix.pre-publish }} publishToMavenLocal

      - name: Test ${{ matrix.sample }}
        run: ./gradlew -p ${{ matrix.path }} ${{ matrix.tasks }}

      - name: Check ${{ matrix.sample }}
        if: ${{ matrix.check }}
        run: ./gradlew -p ${{ matrix.path }} check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-sample-${{ matrix.sample }}
          path: ${{ matrix.path }}/**/build/test-results/**/TEST-*.xml
          retention-days: 1

  test-cache-correctness:
    name: Cache Contract / ${{ matrix.sample }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: kmp-multi-module
            path: samples/kmp-multi-module
          - sample: fake-publishing
            path: samples/fake-publishing/kmp-publisher
          # commonMain + the JVM platform consumer are cache-correct; the Native/JS/Wasm platform
          # fakes are generated by the in-process plugin (not cacheable) and asserted present.
          - sample: kmp-multi-target
            path: samples/kmp-multi-target
            producers: faktGenerateMetadataCommonMain faktGenerateJvmMain
            presence-tasks: compileKotlinJs compileKotlinLinuxX64 compileKotlinWasmJs
            presence-fakes: FakeJsOnlyServiceImpl FakeNativeOnlyServiceImpl FakeWasmOnlyServiceImpl
          # No JVM/Android target: the commonMain producer must be cache-correct on the metadata
          # driver alone; the js/native platform fakes ride the in-process plugin (LEGACY_HYBRID)
          # and are asserted present.
          - sample: kmp-no-jvm
            path: samples/kmp-no-jvm
            producers: faktGenerateMetadataCommonMain
            presence-tasks: compileKotlinJs compileKotlinLinuxX64
            presence-fakes: FakeJsOnlyStorageImpl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Restore Plugin Bundle
        uses: ./.github/actions/restore-plugin-bundle

      # Issue #79: a warmed build cache must never produce empty/missing fakes. Warms the cache,
      # cleans, then rebuilds the FaktGenerateTask producers and asserts they restore FROM-CACHE
      # with the generated .kt present. For projects with non-drivable platform fakes the presence
      # env vars additionally assert those (non-cacheable) fakes are generated.
      - name: Verify cache-correct fakes (#79)
        env:
          FAKT_PRESENCE_TASKS: ${{ matrix.presence-tasks }}
          FAKT_PRESENCE_FAKES: ${{ matrix.presence-fakes }}
        run: ./.github/scripts/cache-correctness-check.sh ${{ matrix.path }} ${{ matrix.producers }}

  test-compat:
    name: Compat / Kotlin ${{ matrix.kotlin-version }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin-version:
          - "2.2.0"
          - "2.2.10"
          - "2.2.20"
          - "2.2.21"
          - "2.3.0"
          - "2.3.10"
          - "2.3.20"
          - "2.4.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Test Compat Sample
        uses: ./.github/actions/test-compat-samples
        with:
          kotlin-version: ${{ matrix.kotlin-version }}

  test-compat-agp:
    name: Compat / AGP ${{ matrix.agp-version }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agp-version:
          - "8.11" # floor: Android test fixtures on AGP 8.x (Gradle 8.13, behind the experimental flag)
          - "8.12" # current: matches the repo's pinned AGP (Gradle 9.0)
          - "9.0" # forward: AGP 9.0, testFixtures Kotlin support without the experimental flag (Gradle 9.1)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Test AGP Compat Sample
        uses: ./.github/actions/test-compat-agp-samples
        with:
          agp-version: ${{ matrix.agp-version }}

  ci-summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - check-code-changes
      - validate-detekt
      - validate-spotless
      - validate-licenses
      - validate-api
      - run-tests
      - publish-plugin-bundle
      - test-samples
      - test-cache-correctness
      - test-compat
      - test-compat-agp
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Download compiler test results
        if: needs.check-code-changes.outputs.has-changes == 'true'
        uses: actions/download-artifact@v8
        with:
          name: test-results-compiler
          path: test-results
        continue-on-error: true

      - name: Download sample test results
        if: needs.check-code-changes.outputs.has-changes == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-sample-*
          path: test-results
          merge-multiple: true
        continue-on-error: true

      - name: Generate test summary
        if: needs.check-code-changes.outputs.has-changes == 'true'
        run: kotlin .github/scripts/test-summary.main.kts "test-results" "Test Results"

      - name: Check CI status
        run: |
          if [[ "${{ needs.check-code-changes.outputs.has-changes }}" == "false" ]]; then
            echo "✅ Documentation-only changes - all jobs skipped successfully"
            exit 0
          fi

          # Check if any job failed
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some CI jobs failed"
            exit 1
          fi

          # Check if any job was cancelled
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️  Some CI jobs were cancelled"
            exit 1
          fi

          echo "✅ All CI jobs passed successfully"
          exit 0

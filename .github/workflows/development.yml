name: Development

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_CI: true

permissions:
  contents: read # Required for checkout

jobs:
  check-code-changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for documentation-only changes
        uses: actions/github-script@v8
        id: check
        with:
          script: |
            const checkChangedFiles = require('./.github/scripts/check-changed-files.js');
            return await checkChangedFiles({
              github,
              context,
              core,
              skipExtensions: ['.md', '.txt']
            });

  validate-detekt:
    name: Validate Detekt
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Detekt
        uses: ./.github/actions/validate-detekt

  validate-spotless:
    name: Validate Spotless
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Spotless
        uses: ./.github/actions/validate-spotless

  validate-licenses:
    name: Validate Licenses
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run License Check
        uses: ./.github/actions/validate-licenses

  validate-api:
    name: Validate API
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run API Check
        uses: ./.github/actions/validate-api

  publish-plugin-bundle:
    name: Publish Plugin Bundle
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Publish Plugin Bundle
        uses: ./.github/actions/publish-plugin-bundle

  run-tests:
    name: Run Tests
    needs: [check-code-changes]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Execute Tests
        uses: ./.github/actions/run-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-compiler
          path: |
            **/build/test-results/**/TEST-*.xml
            !samples/**/build/test-results/**
          retention-days: 1

  test-samples:
    name: Sample / ${{ matrix.sample }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: jvm-single-module
            path: samples/jvm-single-module
            tasks: build
          - sample: android-single-module
            path: samples/android-single-module
            tasks: build
          - sample: android-test-fixtures
            path: samples/android-test-fixtures
            tasks: build
          - sample: jvm-test-fixtures
            path: samples/jvm-test-fixtures
            tasks: build
          - sample: kmp-single-module
            path: samples/kmp-single-module
            tasks: allTests --continue
            check: true
          - sample: kmp-multi-target
            path: samples/kmp-multi-target
            tasks: allTests --continue
            check: true
          - sample: kmp-no-jvm
            path: samples/kmp-no-jvm
            tasks: allTests --continue
            check: true
          - sample: kmp-single-target
            path: samples/kmp-single-target
            tasks: allTests --continue
            check: true
          - sample: kmp-all-jvm
            path: samples/kmp-all-jvm
            tasks: allTests --continue
            check: true
          - sample: kmp-multi-module
            path: samples/kmp-multi-module
            tasks: allTests --continue
            check: true
          - sample: fake-publishing
            path: samples/fake-publishing/kmp-consumer
            tasks: allTests --continue
            check: true
            pre-publish: samples/fake-publishing/kmp-publisher
          # Forwarded compiler options + toolchain JDK (#165). Needs JDK 17 next to JDK 21 (see the
          # "Install JDK 17" step): the :jvm module compiles on a JDK 17 toolchain.
          - sample: compiler-interop
            path: samples/compiler-interop
            tasks: build
          # KMP + androidTarget() through com.android.library (AGP 8.11.1): per-variant generation,
          # flavors and a single-target Android module (#163). The build covers every variant's unit
          # tests, jvmTest and lint; the instrumented compilation is compile-only. A second run must
          # reuse the configuration cache.
          - sample: kmp-android-target
            path: samples/kmp-android-target
            tasks: build compileDebugAndroidTestKotlinAndroid
            cc-reuse: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Restore Plugin Bundle
        uses: ./.github/actions/restore-plugin-bundle

      # compiler-interop compiles its :jvm module on a JDK 17 toolchain (interopToolchain=17). JDK 21
      # stays LAST so it remains the default JAVA_HOME that runs Gradle; JDK 17 is found through the
      # ~/.m2/toolchains.xml that setup-java writes. The shared Setup Environment action is untouched.
      - name: Install JDK 17 for the sample toolchain
        if: ${{ matrix.sample == 'compiler-interop' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Pre-publish dependency
        if: ${{ matrix.pre-publish }}
        env:
          ORG_GRADLE_PROJECT_SKIP_SIGNING: true
        run: ./gradlew -p ${{ matrix.pre-publish }} publishToMavenLocal

      - name: Test ${{ matrix.sample }}
        run: ./gradlew -p ${{ matrix.path }} ${{ matrix.tasks }}

      - name: Check ${{ matrix.sample }}
        if: ${{ matrix.check }}
        run: ./gradlew -p ${{ matrix.path }} check

      # The second run of the same tasks must reuse the entry the first one stored.
      - name: Reuse the configuration cache for ${{ matrix.sample }}
        if: ${{ matrix.cc-reuse }}
        run: |
          ./gradlew -p ${{ matrix.path }} ${{ matrix.tasks }} 2>&1 | tee second-run.log
          grep -q "Configuration cache entry reused" second-run.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-sample-${{ matrix.sample }}
          path: ${{ matrix.path }}/**/build/test-results/**/TEST-*.xml
          retention-days: 1

  test-cache-correctness:
    name: Cache Contract / ${{ matrix.sample }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: kmp-multi-module
            path: samples/kmp-multi-module
          - sample: fake-publishing
            path: samples/fake-publishing/kmp-publisher
          # commonMain, the webMain intermediate (#162) + the JVM, JS and Wasm platform consumers are
          # cache-correct (#151); the
          # Native platform fakes are generated by the in-process plugin (not cacheable, #152) and
          # asserted present.
          - sample: kmp-multi-target
            path: samples/kmp-multi-target
            producers: faktGenerateMetadataCommonMain faktGenerateMetadataWebMain faktGenerateJvmMain faktGenerateJsMain faktGenerateWasmJsMain
            cached-fakes: FakeJvmOnlyServiceImpl FakeJsOnlyServiceImpl FakeWasmOnlyServiceImpl FakeWebStorageImpl
            presence-tasks: compileKotlinLinuxX64
            presence-fakes: FakeNativeOnlyServiceImpl
            # This sample needs no plugin the worker lacks: any tolerated error is a real problem.
            forbid-tolerated: "1"
          # No JVM/Android target: the commonMain producer runs on the metadata driver alone and the
          # JS platform consumer on K2JSCompiler (#151) — both cache-correct.
          - sample: kmp-no-jvm
            path: samples/kmp-no-jvm
            producers: faktGenerateMetadataCommonMain faktGenerateJsMain
            cached-fakes: FakeJsOnlyStorageImpl
          # Exactly one target (#153): no commonMain compilation exists, so the lone jvmMain task
          # owns both halves — common fakes into commonTest, the JVM fake into jvmTest.
          - sample: kmp-single-target
            path: samples/kmp-single-target
            producers: faktGenerateJvmMain
            cached-fakes: FakeSessionRepositoryImpl FakeAnalyticsTrackerImpl FakeSessionFileStoreImpl
          # Every target is a JVM target (#160): Kotlin gives commonMain no compilation, so Fakt adds a
          # synthetic common producer next to the three platform producers. The desktopAndServerMain
          # intermediate source set (#162) gets its own synthetic producer too.
          - sample: kmp-all-jvm
            path: samples/kmp-all-jvm
            producers: faktGenerateCommonMain faktGenerateCliMain faktGenerateDesktopMain faktGenerateServerMain faktGenerateDesktopAndServerMain
            cached-fakes: FakeUserRepositoryImpl FakeWindowManagerImpl FakeRequestLogImpl FakeSessionStoreImpl
            # This sample needs no plugin the worker lacks: any tolerated error is a real problem.
            forbid-tolerated: "1"
          # Extra Android build types whose names contain another variant's name (#164b): one producer
          # per variant. Task names follow taskLayoutFor (empty KGP target name -> "androidjvm").
          - sample: android-single-module
            path: samples/android-single-module
            producers: faktGenerateAndroidjvmDebug faktGenerateAndroidjvmDebugMinified faktGenerateAndroidjvmRelease faktGenerateAndroidjvmPreRelease
            cached-fakes: FakeUserRepositoryImpl FakeAppInfoProviderImpl FakeAuthenticationServiceImpl FakePropertyAndMethodInterfaceImpl
          # AGP 9 built-in Kotlin (#154): the KGP source sets are empty, so the debug producer reads
          # its sources from AGP's variant API. Includes an android.content.Context-typed fake (#158).
          - sample: compat-agp-9.0
            path: samples/compat-agp/agp-9.0
            producers: faktGenerateAndroidjvmDebug
            cached-fakes: FakeUserRepositoryImpl FakeAppInfoProviderImpl
          # Forwarded compiler options and toolchain JDK (#165): the main code only compiles with a
          # module-wide opt-in and -Xcontext-sensitive-resolution, so these producers can only be
          # cache-correct if the forwarded arguments are relocatable. The :jvm module is on JDK 17.
          - sample: compiler-interop
            path: samples/compiler-interop
            producers: :jvm:faktGenerateJvmMain :kmp:faktGenerateMetadataCommonMain :kmp:faktGenerateJvmMain :kmp:faktGenerateJsMain
            cached-fakes: FakeInvoiceRendererImpl FakeNotifierImpl FakeJvmOnlyFilesImpl FakeJsOnlyStorageImpl
            # These modules need no plugin the worker lacks: any tolerated error means an option
            # was not forwarded and the worker hid it.
            forbid-tolerated: "1"
          # The serialization plugin runs in compileKotlin but not in the Fakt worker, so the worker
          # must tolerate the unresolved Receipt.serializer() (#165). expect-tolerated keeps this
          # sample honest: it fails if nothing is tolerated any more.
          - sample: compiler-interop-serialization
            path: samples/compiler-interop
            producers: :serialization:faktGenerateJvmMain
            cached-fakes: FakeReceiptSinkImpl FakeClockImpl
            expect-tolerated: "1"
          # KMP + androidTarget() (#163): one producer per Android variant, each emitting its own copy
          # of the androidMain fakes, plus the metadata/JVM producers; :android-only has no commonMain
          # metadata compilation, so its commonMain fakes come from faktGenerateCommonMain.
          - sample: kmp-android-target
            path: samples/kmp-android-target
            producers: :shared:faktGenerateMetadataCommonMain :shared:faktGenerateJvmMain :shared:faktGenerateAndroidDebug :shared:faktGenerateAndroidRelease :android-only:faktGenerateCommonMain :android-only:faktGenerateAndroidDebug :android-only:faktGenerateAndroidRelease :flavored:faktGenerateAndroidFreeDebug :flavored:faktGenerateAndroidPaidRelease
            cached-fakes: FakeUserRepositoryImpl FakeAndroidOnlyImpl FakeFlagReaderImpl FakeDebugMenuImpl FakeJvmOnlyImpl FakeClockImpl FakeBatteryImpl FakeFeatureGateImpl FakeTierFeaturesImpl
            # This sample needs no plugin the worker lacks: any tolerated error is a real problem.
            forbid-tolerated: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Restore Plugin Bundle
        uses: ./.github/actions/restore-plugin-bundle

      # compiler-interop compiles its :jvm module on a JDK 17 toolchain (interopToolchain=17). JDK 21
      # stays LAST so it remains the default JAVA_HOME that runs Gradle; JDK 17 is found through the
      # ~/.m2/toolchains.xml that setup-java writes. The shared Setup Environment action is untouched.
      - name: Install JDK 17 for the sample toolchain
        # Both compiler-interop cells configure the :jvm module, so both need the JDK 17 toolchain.
        if: ${{ startsWith(matrix.sample, 'compiler-interop') }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Issue #79: a warmed build cache must never produce empty/missing fakes. Warms the cache,
      # cleans, then rebuilds the FaktGenerateTask producers and asserts they restore FROM-CACHE
      # with the generated .kt present. `cached-fakes` pins the platform fakes that must come back
      # from cache; for projects with non-drivable (Native) platform fakes the presence env vars
      # additionally assert those (non-cacheable) fakes are generated.
      - name: Verify cache-correct fakes (#79)
        env:
          FAKT_CACHED_FAKES: ${{ matrix.cached-fakes }}
          FAKT_PRESENCE_TASKS: ${{ matrix.presence-tasks }}
          FAKT_PRESENCE_FAKES: ${{ matrix.presence-fakes }}
          FAKT_FORBID_TOLERATED: ${{ matrix.forbid-tolerated }}
          FAKT_EXPECT_TOLERATED: ${{ matrix.expect-tolerated }}
        run: ./.github/scripts/cache-correctness-check.sh ${{ matrix.path }} ${{ matrix.producers }}

  test-clean-rebuild-cache:
    name: Clean+Cache Contract / ${{ matrix.sample }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The cache-correct default: FaktGenerateTask declares the generated .kt as outputs, so a
          # warm cache restores them with the compilation.
          - sample: jvm-test-fixtures
            path: samples/jvm-test-fixtures
            tasks: ":app:test"
          # Single-target KMP was one of the shapes #142 was reproduced on; since #153 its fakes are
          # declared task outputs, so `clean jvmTest` on a warm cache must still find them.
          - sample: kmp-single-target
            path: samples/kmp-single-target
            tasks: jvmTest
          # Every target is JVM (#160): the synthetic common producer's fakes, and the synthetic
          # desktopAndServerMain producer's (#162), must also survive a clean.
          - sample: kmp-all-jvm
            path: samples/kmp-all-jvm
            tasks: desktopTest serverTest cliTest serverIntegrationTest
          # Each build type's fakes reach only that variant's unit tests: debugMinified and preRelease
          # used to redeclare the debug/release fakes (#164b).
          - sample: android-single-module
            path: samples/android-single-module
            tasks: testDebugMinifiedUnitTest testPreReleaseUnitTest
          # The in-process opt-out, which is where #142 was reported. Generation rides
          # compileKotlin*, so that task must stay out of the build cache or the fakes never land.
          - sample: jvm-test-fixtures-in-process
            path: samples/jvm-test-fixtures
            tasks: ":app:test"
            gradle: "./gradlew -p samples/jvm-test-fixtures -Pfakt.useExperimentalGenerateTask=false"
          # Each Android variant's fakes reach only that variant's unit tests, also for flavors and
          # the single-target module (#163).
          - sample: kmp-android-target
            path: samples/kmp-android-target
            tasks: ":shared:testDebugUnitTest :shared:testReleaseUnitTest :android-only:testDebugUnitTest :flavored:testPaidReleaseUnitTest"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Restore Plugin Bundle
        uses: ./.github/actions/restore-plugin-bundle

      # Issue #142: `clean <consumerTask>` against a warm build cache must still leave the generated
      # fakes on disk. Where #79's contract targets the faktGenerate* producers directly, this one
      # drives a downstream consumer task and never names a producer — whatever the build does to
      # satisfy it, the fakes have to be there when the consuming compilation runs.
      - name: Verify fakes survive clean on a warm cache (#142)
        env:
          FAKT_GRADLE: ${{ matrix.gradle }}
        run: ./.github/scripts/clean-rebuild-cache-check.sh ${{ matrix.path }} ${{ matrix.tasks }}

  test-compat:
    name: Compat / Kotlin ${{ matrix.kotlin-version }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin-version:
          - "2.2.0"
          - "2.2.10"
          - "2.2.20"
          - "2.2.21"
          - "2.3.0"
          - "2.3.10"
          - "2.3.20"
          - "2.4.10"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Test Compat Sample
        uses: ./.github/actions/test-compat-samples
        with:
          kotlin-version: ${{ matrix.kotlin-version }}

  test-compat-agp:
    name: Compat / AGP ${{ matrix.agp-version }}
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agp-version:
          - "8.11" # floor: Android test fixtures on AGP 8.x (Gradle 8.13)
          - "8.12" # current: matches the repo's pinned AGP (Gradle 9.0)
          - "9.0" # forward: AGP 9.0 built-in Kotlin (sources from the variant API, #154), testFixtures Kotlin without the experimental flag (Gradle 9.1)
          - "9.4" # newest: AGP 9.4 with KGP applied, so the AGP APIs Fakt calls run on the task path (Gradle 9.6.1)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Test AGP Compat Sample
        uses: ./.github/actions/test-compat-agp-samples
        with:
          agp-version: ${{ matrix.agp-version }}

  test-kmp-android-lint:
    name: Compat / KMP+Android lint (Gradle 9.6.1)
    needs: [check-code-changes, publish-plugin-bundle]
    if: ${{ needs.check-code-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Restore Plugin Bundle
        uses: ./.github/actions/restore-plugin-bundle

      # End-to-end smoke test for #129: runs AGP lint on a KMP+Android module pinned to its OWN
      # Gradle 9.6.1 wrapper (the root wrapper is older), exercising lintAnalyzeAndroidHostTest over
      # the commonTest generated source dir.
      - name: Run AGP lint under Gradle 9.6.1
        working-directory: samples/kmp-android-lint
        run: ./gradlew lint --no-daemon

      # `lint` alone used to leave faktGenerateMetadataCommonMain out of the task graph, so the step
      # above linted a directory nothing had produced and could not catch the implicit-dependency
      # failure at all. `build` pulls the generator in through the compile tasks, which is the graph
      # that reproduces it. Keep both: the first pins the lint-only graph, this one the full graph.
      # The deterministic regression guard is FaktGenerateTaskWiringTest's lint-ordering tests.
      - name: Run AGP lint with the generator in the task graph
        working-directory: samples/kmp-android-lint
        run: ./gradlew clean build lint --no-daemon

      # AGP's `android.kmp.use.jvm.platform.type` flag makes the Android target a plain JVM-typed
      # target, so the project has no non-JVM target and no commonMain compilation (#160). Fakt's
      # synthetic common producer must then feed commonTest of the host test.
      - name: Run Android host tests with the JVM platform type (#160)
        working-directory: samples/kmp-android-lint
        run: ./gradlew clean testAndroidHostTest -Pandroid.kmp.use.jvm.platform.type=true --no-daemon

  ci-summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - check-code-changes
      - validate-detekt
      - validate-spotless
      - validate-licenses
      - validate-api
      - run-tests
      - publish-plugin-bundle
      - test-samples
      - test-cache-correctness
      - test-clean-rebuild-cache
      - test-compat
      - test-compat-agp
      - test-kmp-android-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Download compiler test results
        if: needs.check-code-changes.outputs.has-changes == 'true'
        uses: actions/download-artifact@v8
        with:
          name: test-results-compiler
          path: test-results
        continue-on-error: true

      - name: Download sample test results
        if: needs.check-code-changes.outputs.has-changes == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-sample-*
          path: test-results
          merge-multiple: true
        continue-on-error: true

      - name: Generate test summary
        if: needs.check-code-changes.outputs.has-changes == 'true'
        run: kotlin .github/scripts/test-summary.main.kts "test-results" "Test Results"

      - name: Check CI status
        run: |
          if [[ "${{ needs.check-code-changes.outputs.has-changes }}" == "false" ]]; then
            echo "✅ Documentation-only changes - all jobs skipped successfully"
            exit 0
          fi

          # Check if any job failed
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some CI jobs failed"
            exit 1
          fi

          # Check if any job was cancelled
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️  Some CI jobs were cancelled"
            exit 1
          fi

          echo "✅ All CI jobs passed successfully"
          exit 0

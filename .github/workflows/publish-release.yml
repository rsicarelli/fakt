name: Publish Release

on:
  workflow_dispatch:
    inputs:
      bump:
        required: true
        type: choice
        description: 'Version bump type'
        default: 'minor'
        options:
          - major
          - minor
          - patch
      release_type:
        required: true
        type: choice
        description: 'Release type'
        default: 'alpha'
        options:
          - alpha
          - beta
          - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_CI: true
  ORG_GRADLE_PROJECT_RELEASE_MODE: true

jobs:
  guard-release:
    name: Guard Release
    runs-on: ubuntu-latest
    steps:
      - name: Fail if branch is not main
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        run: |
          echo "This workflow should only be triggered from main/master branch"
          exit 1

  validate-detekt:
    name: Validate Detekt
    needs: [guard-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Detekt
        uses: ./.github/actions/validate-detekt

  validate-spotless:
    name: Validate Spotless
    needs: [guard-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Spotless
        uses: ./.github/actions/validate-spotless

  validate-licenses:
    name: Validate Licenses
    needs: [guard-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run License Check
        uses: ./.github/actions/validate-licenses

  validate-api:
    name: Validate API
    needs: [guard-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run API Check
        uses: ./.github/actions/validate-api

  publish-plugin-bundle:
    name: Publish Plugin Bundle
    needs: [guard-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Publish Plugin Bundle
        uses: ./.github/actions/publish-plugin-bundle

  run-tests:
    name: Run Tests
    needs: [guard-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Execute Tests
        uses: ./.github/actions/run-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-compiler
          path: |
            **/build/test-results/**/TEST-*.xml
            !samples/**/build/test-results/**
          retention-days: 1

  test-samples:
    name: Sample / ${{ matrix.sample }}
    needs: [guard-release, publish-plugin-bundle]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: jvm-single-module
            path: samples/jvm-single-module
            tasks: build
          - sample: android-single-module
            path: samples/android-single-module
            tasks: build
          - sample: jvm-test-fixtures
            path: samples/jvm-test-fixtures
            tasks: build
          - sample: kmp-single-module
            path: samples/kmp-single-module
            tasks: allTests --continue
            check: true
          - sample: kmp-multi-target
            path: samples/kmp-multi-target
            tasks: allTests --continue
            check: true
          - sample: kmp-multi-module
            path: samples/kmp-multi-module
            tasks: allTests --continue
            check: true
          - sample: fake-publishing
            path: samples/fake-publishing/kmp-consumer
            tasks: allTests --continue
            check: true
            pre-publish: samples/fake-publishing/kmp-publisher
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Restore Plugin Bundle
        uses: ./.github/actions/restore-plugin-bundle

      - name: Pre-publish dependency
        if: ${{ matrix.pre-publish }}
        env:
          ORG_GRADLE_PROJECT_SKIP_SIGNING: true
        run: ./gradlew -p ${{ matrix.pre-publish }} publishToMavenLocal

      - name: Test ${{ matrix.sample }}
        run: ./gradlew -p ${{ matrix.path }} ${{ matrix.tasks }}

      - name: Check ${{ matrix.sample }}
        if: ${{ matrix.check }}
        run: ./gradlew -p ${{ matrix.path }} check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-sample-${{ matrix.sample }}
          path: ${{ matrix.path }}/**/build/test-results/**/TEST-*.xml
          retention-days: 1

  validation-summary:
    name: Validation Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - guard-release
      - validate-detekt
      - validate-spotless
      - validate-licenses
      - validate-api
      - run-tests
      - publish-plugin-bundle
      - test-samples
    steps:
      - name: Check validation status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some validation jobs failed"
            exit 1
          fi

          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️  Some validation jobs were cancelled"
            exit 1
          fi

          if [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "⚠️  Some validation jobs were skipped (upstream guard likely failed)"
            exit 1
          fi

          echo "✅ All validation jobs passed successfully"
          exit 0

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: validation-summary
    outputs:
      version_published: ${{ steps.published.outputs.version }}
      version_new: ${{ steps.bump.outputs.version_new }}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Configure Release Bot
        uses: ./.github/actions/configure-release-bot
        with:
          bot-name: ${{ vars.RELEASE_BOT_NAME }}
          bot-app-id: ${{ vars.RELEASE_BOT_APP_ID }}

      - name: Publish to Maven Central
        run: |
          ./gradlew publishAndReleaseToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Capture Published Version
        id: published
        run: |
          CURRENT=$(grep "version=" gradle.properties | cut -d'=' -f2)
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "tag=v$CURRENT" >> $GITHUB_OUTPUT

      - name: Create Tag for Published Version
        run: |
          git tag "v${{ steps.published.outputs.version }}"
          git push origin "v${{ steps.published.outputs.version }}"

      - name: Create GitHub Release
        uses: ./.github/actions/create-github-release
        with:
          tag: "v${{ steps.published.outputs.version }}"
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Prepare for Next Version
        id: prepare
        run: |
          bash .github/scripts/prepare-next-release.sh \
            "${{ steps.published.outputs.version }}" \
            "${{ github.event.inputs.bump }}" \
            "${{ github.event.inputs.release_type }}"

      - name: Push Changes
        run: git push origin HEAD

  deploy-docs:
    name: Deploy Release Documentation
    needs: publish
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      version: ${{ needs.publish.outputs.version_published }}
      alias: 'latest'
      set-default: true

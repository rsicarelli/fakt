# Gradle Performance Configuration
org.gradle.daemon=true
org.gradle.parallel=true
# Disabled: build caching / config cache interact badly with the composite Fakt compiler plugin
# after a clean, and a benchmark must measure real execution, never a cached test result.
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.configureondemand=false

# JVM Memory Settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin Compiler Configuration
kotlin.incremental=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# KSP (Mockative). KSP2 is required for Kotlin 2.x.
ksp.useKSP2=true

# Gradle Performance Configuration
org.gradle.daemon=true
org.gradle.parallel=true
# Every fake in this sample comes from a FaktGenerateTask (declared outputs), so both the build
# cache and the configuration cache are safe here (issue #160).
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# JVM Memory Settings
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin Compiler Configuration
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# Kotlin reports two targets of the same type (`jvm("desktop")` + `jvm("server")`) as an error.
# This sample uses that shape on purpose, so the check is switched off here.
kotlin.internal.suppressGradlePluginErrors=KotlinTargetAlreadyDeclaredError

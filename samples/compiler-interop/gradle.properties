# Gradle
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# JDK the :jvm module compiles and tests on (a Gradle toolchain, not the JDK running Gradle).
# CI installs JDK 17 next to JDK 21, so the default proves the toolchain is forwarded to the
# Fakt worker. A machine with only JDK 21 passes -PinteropToolchain=21 instead.
interopToolchain=17

# Consumer Sample - Separate project consuming published fakes
group=com.rsicarelli.fakt.samples.consumer
version=1.0.0-LOCAL

# Memory settings for KMP
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin settings
kotlin.mpp.stability.nowarn=true
kotlin.js.yarn=false

# P8 dry-run: exercise the cache-correct FaktGenerateTask path (issue #79)
fakt.useExperimentalGenerateTask=true

# Enable Kotlin Default Hierarchy Template
kotlin.mpp.applyDefaultHierarchyTemplate=true

# Gradle Performance Configuration
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# CI reuses the configuration cache for this sample (cc-reuse).
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# JVM Memory Settings
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin Compiler Configuration
kotlin.incremental=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m

# Kotlin Native: Apple targets are declared on every host and compiled only where possible
kotlin.native.ignoreDisabledTargets=true

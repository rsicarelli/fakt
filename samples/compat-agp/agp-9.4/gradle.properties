org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# The newest-AGP cell opts out of AGP 9's built-in Kotlin and applies KGP's
# `org.jetbrains.kotlin.android` instead. That puts it on Fakt's cache-correct FaktGenerateTask
# path, so the AGP APIs Fakt calls (e.g. the SDK boot classpath, issue #158) run against the newest
# AGP and not only against the 8.11 floor Fakt compiles against. The built-in Kotlin shape is the
# agp-9.0 cell.
android.builtInKotlin=false
android.newDsl=false

# With built-in Kotlin off, AGP 9 still gates Kotlin compilation of the testFixtures source set
# behind this flag, exactly like AGP 8.x.
android.experimental.enableTestFixturesKotlinSupport=true
